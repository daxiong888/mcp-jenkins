name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to verify"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm ci
      - name: Verify package identity and release tag
        run: node scripts/verify-release-metadata.mjs "$RELEASE_TAG" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Inspect publish contents
        run: npm publish --dry-run --access public --tag "$NPM_DIST_TAG"
      - name: Publish to npm with provenance
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
      - name: Report disabled publishing
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: echo "Publishing is disabled; set NPM_PUBLISH_ENABLED=true only after npm scope and trusted-publisher verification."
