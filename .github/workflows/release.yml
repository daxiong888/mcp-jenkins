name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish"
        required: true
        type: string
      confirm_publish:
        description: "Type publish to confirm the Registry write"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_REF: ${{ format('refs/tags/{0}', inputs.release_tag) }}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Confirm explicit publication
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [ "$CONFIRM_PUBLISH" != "publish" ]; then
            echo "::error::confirm_publish must be exactly 'publish'"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Use trusted-publishing-compatible npm
        run: npm install --global npm@11.6.2
      - name: Report release toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Verify package identity and release tag
        run: node scripts/verify-release-metadata.mjs "$RELEASE_TAG" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Inspect publish contents
        run: npm publish --dry-run --access public --tag "$NPM_DIST_TAG"
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
